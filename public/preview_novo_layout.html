o=format&fit=crop&w=1800&q=80`,secondaryImage:`https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1200&q=80`,metrics:[{value:`+59,6%`,label:`DE ALCANCE QUALIFICADO`,context:`CASE REAL: Crescimento orgânico e patrocinado focado em investidores e compradores de alto padrão em SC e PR.`},{value:`3.4x`,label:`AUMENTO EM REUNIÕES COMERCIAIS`,context:`Leads que já chegam ao comercial compreendendo o conceito, os diferenciais e a faixa de valor.`}],challenge:`O mercado frequentemente confunde construção modular com soluções provisórias ou de baixo custo. O desafio da Dimorino era transmitir precisão de engenharia, sofisticação de acabamento e liquidez imobiliária para investidores qualificados.`,whatWasDone:[`Redefinição da narrativa visual e discurso de vendas institucional`,`Direção criativa de captação em obras prontas e em processo fabril`,`Segmentação cirúrgica em Meta Ads & Google Ads por raio de poder aquisitivo`,`Criação de páginas de destino orientadas à qualificação de investidores`],strategy:`Parar de vender "módulos" e começar a vender velocidade de implantação, sustentabilidade arquitetônica e rentabilidade por metro quadrado. O conteúdo precisava ter peso de revista de arquitetura contemporânea.`,execution:`Produção audiovisual com fotografia limpa, ritmo pausado e foco na matéria-prima: esquadrias minimalistas, iluminação natural e precisão milimétrica. Paralelamente, campanhas de tráfego filtradas por interesse em incorporação e condomínios fechados.`,results:`A marca deixou de competir por preço com containers convencionais e passou a ser cotada por escritórios de arquitetura e famílias que buscavam refúgios de fim de semana de alto padrão.`,learnings:`Quando o produto é de alto valor agregado, o marketing não serve para pressionar compra imediata, mas para eliminar todas as dúvidas antes do cliente sentar com o diretor comercial.`},{id:`miriam-schwenck`,number:`02`,client:`MIRIAM SCHWENCK`,category:`DERMATOLOGIA DE ALTA PRECISÃO`,tags:[`MEDICINA`,`AUTORIDADE`,`POSICIONAMENTO`,`CONTEÚDO`],headline:`Elegância médica e sobriedade científica no lugar de modismos passageiros.`,summary:`Em um mercado saturado de promessas estéticas rápidas e excesso de filtros, reposicionamos a comunicação médica para valorizar a naturalidade, o rigor clínico e a escuta individualizada.`,coverImage:`https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1800&q=80`,secondaryImage:`https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1200&q=80`,metrics:[{value:`+82%`,label:`BUSCA DIRETA PELA PROFISSIONAL`,context:`Crescimento de busca ativa orgânica pelo nome da médica nos canais de agendamento.`},{value:`Zero`,label:`DESCONTO POR COMPARATIVO`,context:`Pacientes que chegam convictos do protocolo e da exclusividade do atendimento.`}],challenge:`A estética médica tem sofrido com a homogeneização de conteúdos no Instagram: dancinhas, dublagens ou imagens invasivas de "antes e depois" que depreciam a credibilidade técnica e ferem o código de ética.`,whatWasDone:[`Alinhamento editorial focado em ciência da pele, longevidade e procedimentos sutis`,`Identidade fotográfica com luz natural e direção humanizada em consultório`,`Estruturação de funil de acolhimento no WhatsApp para triagem elegante de pacientes`,`Artigos e pautas aprofundadas sobre biotecnologia e tecnologias de ponta`],strategy:`Atrair a paciente que valoriza a discrição e a segurança do procedimento. A comunicação transmite calma, tempo e autoridade silenciosa, sem sensacionalismo.`,execution:`Textos com substância científica explicados com didática refinada. Fotos autorais sem maquiagem pesada ou filtros distorcidos. Fluxo no WhatsApp com tempo de resposta imediato e tratamento acolhedor.`,results:`Agenda consistente com ticket médio elevado e migração de pacientes casuais para tratamentos continuados de gerenciamento do envelhecimento.`,learnings:`Na medicina e saúde premium, a autoridade não se grita; ela se comprova pelo respeito ao tempo, pelo cuidado com as palavras e pela coerência estética.`},{id:`jreefersul`,number:`03`,client:`JREEFERSUL`,category:`LOGÍSTICA & CADEIA DO FRIO`,tags:[`LOGÍSTICA`,`B2B`,`ENGENHARIA`,`TRÁFEGO B2B`],headline:`Conectando a cadeia do frio a contratos industriais estratégicos.`,summary:`A Jreefersul atua na manutenção e monitoramento de contêineres refrigerados (reefers) para gigantes do comércio exterior e operadores portuários do Sul do Brasil.`,coverImage:`https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1800&q=80`,secondaryImage:`https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=1200&q=80`,metrics:[{value:`+140%`,label:`SOLICITAÇÕES DE PROPOSTAS B2B`,context:`Novas consultas comerciais originadas de tomadores de decisão em armadores e tradings.`},{value:`100%`,label:`FOCO CORPORATIVO B2B`,context:`Filtro absoluto de leads desqualificados através de formulário técnico estruturado.`}],challenge:`Empresas industriais B2B frequentemente acreditam que "marketing não funciona para o nosso setor" porque tentam aplicar fórmulas de varejo B2C em decisões que envolvem milhões em carga perecível.`,whatWasDone:[`Mapeamento de jornada de gerentes de logística, armadores e despachantes aduaneiros`,`Desenvolvimento de posicionamento centrado em confiabilidade térmica e tempo de resposta zero`,`Campanhas focadas em termos de alta intenção comercial no Google Search`,`Páginas de contingência e atendimento emergencial 24 horas para portos`],strategy:`Tornar a Jreefersul a primeira escolha quando um reefer apresenta oscilação de temperatura e o exportador precisa de solução imediata para não perder cargas refrigeradas valiosas.`,execution:`Conteúdo técnico sobre telemetria, normas internacionais de frio e peças de reposição homologadas. Tráfego ativo em horários críticos e palavras-chave de emergência técnica portuária.`,results:`Fechamento de novos contratos anuais de manutenção preventiva com frotas de transporte refrigerado nos complexos portuários de Santa Catarina.`,learnings:`No B2B de missão crítica, marketing é previsibilidade e segurança de quem contrata. O tom deve ser direto, cirúrgico e focado em risco evitado.`},{id:`labduo`,number:`04`,client:`LABDUO`,category:`DESIGN & EXPERIÊNCIA DE ESPAÇOS`,tags:[`DESIGN`,`IDENTIDADE`,`INTERIORES`,`POSICIONAMENTO`],headline:`Transformando projetos autorais em objetos de desejo e valor percebido.`,summary:`Um estúdio criativo que precisava romper a barreira do mercado local para atender clientes em todo o território nacional.`,coverImage:`https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1800&q=80`,secondaryImage:`https://images.unsplash.com/photo-1507089947368-19c1da9775ae?auto=format&fit=crop&w=1200&q=80`,metrics:[{value:`2.8x`,label:`VALOR MÉDIO POR PROJETO`,context:`Repensando a proposta de valor e a apresentação comercial da marca.`}],challenge:`Muitos estúdios excelentes produzem um trabalho de alto nível mas o comunicam de maneira tímida, caindo na vala comum de orçamentos por metro quadrado.`,whatWasDone:[`Reestruturação de portfólio digital sob formato editorial de cases`,`Estratégia de distribuição de projetos autorais em mídias de arquitetura e design`,`Criação de esteira de conteúdo em carrosséis técnicos explicativos`],strategy:`Explicar o "porquê" de cada linha e material, não apenas mostrar fotos bonitas de ambiente pronto. Vender a atmosfera, a acústica e a sensação do espaço.`,execution:`Fotografia com luz natural que evidencia texturas, madeira maciça e pedras brutas. Textos curtos com vocabulário de curadoria artística.`,results:`Atração orgânica de incorporadoras e investidores para projetos de lounges corporativos e residências exclusivas.`,learnings:`Quem sabe justificar o conceito do seu projeto no digital não precisa negociar preço na mesa.`}],D=[`DIMORINO`,`MIRIAM SCHWENCK`,`JREEFERSUL`,`LABDUO`,`CASA K`,`ARENA ESTOFAD           0% { transform: translateX(0); }

        }
      `})]})}var ze=[{id:`marketing-nao-e-post`,title:`Marketing não é post.`,category:`POSICIONAMENTO`,readTime:`3 min`,date:`Setembro 2026`,excerpt:`Se a sua agência mede sucesso por quantidade de publicações no mês, você está pagando por burocracia, não por estratégia comercial.`,content:[`Durante a última década, convencionou-se que fazer marketing digital significava contratar um pacote com "12 posts por mês" ou "3 carrosséis por semana". Essa métrica foi criada para dar previsibilidade às agências, não para gerar faturamento às empresas.`,`Uma empresa não precisa aparecer todo dia com conteúdo superficial dizendo "Feliz Dia do Cliente" ou desejando "Uma excelente segunda-feira". Quando uma marca publica sem tese clara, ela não constrói autoridade — ela polui o feed de quem poderia comprar.`,`O marketing contemporâneo opera sob outra premissa: menos ruído, mais relevância. Uma única peça profunda, que resolve a dúvida mais difícil do seu comprador ou demonstra os bastidores do seu padrão de entrega, vale mais do que trinta publicações vazias.`,`Marketing de verdade é a soma de Posicionamento, Narrativa, Distribuição Paga e Conversão. Se tirar o post e a empresa continuar faturando porque o sistema de vendas está ativo, o marketing funcionou.`]},{id:`trafego-pago-e-para-o-seu-negocio`,title:`Tráfego pago é para o seu negócio e podemos provar.`,category:`TRÁFEGO & ESCALA`,readTime:`4 min`,date:`Setembro 2026`,excerpt:`Seja você uma indústria B2B de maquinário pesado ou uma clínica médica de alto padrão, a atenção do seu cliente está numa tela.`,content:[`Ainda ouvimos empresários afirmarem: "Meu cliente não está no Instagram" ou "Meu setor é muito tradicional para anúncios no Google".`,`A verdade nua e crua: todo tomador de decisão, diretor de suprimentos, médico, investidor imobiliário ou arquiteto acorda e confere o smartphone. Ele pesquisa no Google quando precisa resolver uma emergência e navega nas redes sociais no tempo ocioso.`,`A diferença está em como você conversa com ele. Tráfego pago em setores sérios não usa dancinha ou apelo vulgar; usa segmentação contextual, palavras-chave de intenção corporativa e criativos que transmitem respeito pelo tempo da pessoa.`,`Tráfego é apenas o meio de transporte. Se a carga (a mensagem e a proposta) for valiosa, o retorno sobre o investimento não é sorte, é matemática.`]},{id:`voce-nao-precisa-de-seguidores`,title:`Você não precisa de seguidores. Você precisa de vendas.`,category:`ESTRATÉGIA COMERCIAL`,readTime:`3 min`,date:`Setembro 2026`,excerpt:`Perfis com 80 mil seguidores que fecham no vermelho versus empresas com 2 mil seguidores que faturam milhões com ticket alto.`,content:[`Métrica de vaidade é o maior anestésico do mercado digital. É fácil se sentir bem ao ver o contador de seguidores subir, mas seguidor não paga folha de pagamento de colaborador.`,`Para empresas que vendem serviços especializados, produtos de alto valor agregado ou soluções B2B, você não precisa de 100 mil pessoas assistindo seus stories. Você precisa de 50 empresas certas que compreendem o seu valor e têm poder de compra.`,`Quando mudamos a métrica norteadora de "engajamento de massa" para "qualidade de lead que chama no WhatsApp", todo o marketing muda de postura. O texto fica mais maduro, a estética fica mais limpa e os clientes que chegam não pedem desconto.`]},{id:`instagram-posiciona-ou-improvisado`,title:`O Instagram da sua empresa te posiciona ou parece improvisado?`,category:`IDENTIDADE & MARCA`,readTime:`4 min`,date:`Setembro 2026`,excerpt:`Quando um cliente em potencial visita o perfil da sua empresa após uma indicação, o que ele sente nos primeiros 5 segundos?`,content:[`A indicação boca a boca continua sendo um canal poderoso, mas hoje ela tem uma segunda etapa obrigatória: a verificação digital. Antes de responder a indicação, o cliente joga o nome da sua empresa no Instagram ou no Google.`,`Se ao abrir seu perfil ele encontra artes genéricas feitas em templates prontos, fotos com baixa resolução, fontes desproporcionais e posts esparsos sem linha editorial, o prestígio construído na indicação é quebrado instantaneamente.`,`Um perfil de alta percepção não é extravagante. Ele é limpo, com fotografia autoral de qualidade, destaques organizados como um menu institucional e textos claros sobre o que a empresa faz. Menos elementos, mais rigor.`]},{id:`por-que-algumas-marcas-sao-lembradas`,title:`Por que algumas marcas são lembradas?`,category:`FILOSOFIA & PERCEPÇÃO`,readTime:`5 min`,date:`Setembro 2026`,excerpt:`A diferença entre ser apenas mais uma opção no mercado e se tornar uma referência indiscutível para o seu cliente.`,content:[`Marcas memoráveis não são aquelas que falam mais alto, mas aquelas que têm uma posição firme e não abrem mão dela.`,`Ser lembrado exige coragem para não agradar todo mundo. Quando uma empresa tenta ser tudo para todos (a mais barata, a mais rápida, a mais inovadora, a mais carinhosa), ela se torna invisível. Não há relevo.`,`A memória do cliente se ancora em pontos de contraste: uma promessa clara, uma estética inconfundível e uma experiência de compra que cumpre com exatidão aquilo que o marketing anunciou.`,`Essa é a razão pela qual a Elevarte existe: para tirar empresas sérias da vala comum e colocá-las no lugar que merecem ocupar na percepção do mercado.`]}];function Be({article:e,onClose:t,onOpenContact:n}){return e?(0,x.jsx)(`div`,{id:`article-reader-modal`,className:`fixed inset-0 z-50 bg-[#0B0B0D]/95 backdrop-blur-xl flex justify-center overflow-y-auto animate-fade-in text-white p-6 sm:p-12`,role:`dialog`,"aria-modal":`true`,children:(0,x.jsxs)(`div`,{className:`relative w-full max-w-3xl min-h-screen py-12 flex flex-col justify-between`,children:[(0,x.jsxs)(`div`,{children:[(0,x.jsxs)(`div`,{className:`flex items-center justify-between border-b border-white/10 pb-6 mb-10`,children:[(0,x.jsxs)(`div`,{className:`flex items-center gap-3 text-xs font-mono text-[#848CF7]`,children:[(0,x.jsx)(ue,{className:`w-4 h-4`}),
